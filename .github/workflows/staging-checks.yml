name: Next.js staging checks
on:
  push:
    branches:
      - feature/nextjs-conference-platform
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund
      - name: Confirm original venue image files exist
        run: npm run check:assets
      - name: TypeScript check
        run: npm run typecheck
      - name: Production build
        run: npm run build
        env:
          SITE_PUBLIC: 'false'
          NEXT_PUBLIC_SITE_URL: 'https://example.com'

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: PostgreSQL 17 client tools (pg_dump/pg_restore must match the server)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
      - name: Database suites (fresh + live-clone) and release rehearsal (backup, STEP A/B, rollback)
        env:
          PG_DUMP: /usr/lib/postgresql/17/bin/pg_dump
          PG_RESTORE: /usr/lib/postgresql/17/bin/pg_restore
        run: scripts/test-db.sh
